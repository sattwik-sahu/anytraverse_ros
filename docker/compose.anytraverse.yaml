services:
  anytraverse:
    command: >
      ros2 launch anytraverse_ros anytraverse.launch.py
      params_file:=/ws/config/anytraverse.yaml
      "init_prompt:=${INIT_PROMPT}"
      "ns:=${ANYTRAVERSE_NAMESPACE:-}"
    network_mode: host
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HF_HOME: /ws/.hf-cache
      TRANSFORMERS_OFFLINE: ${OFFLINE:-1}
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
    volumes:
      - ${CONFIG_DIR:-../config}:/ws/config:ro
      - hf-cache:/ws/.hf-cache
    restart: unless-stopped

volumes:
  hf-cache:
