[workspace]
name = "anytraverse_ros"
description = "ROS2 wrapper for AnyTraverse"
channels = ["https://prefix.dev/conda-forge"]
platforms = [
  "linux-64",
  "osx-arm64",
  { name = "jetpack-6", platform = "linux-aarch64", cuda = "12.9" },
  { name = "jetpack-7", platform = "linux-aarch64", cuda = "13.2" },
]

[target.unix.activation]
# For activation scripts, we use bash for Unix-like systems
scripts = ["install/setup.bash"]
env = { RMW_IMPLEMENTATION = "rmw_zenoh_cpp" }

[target.osx-arm64.activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"
PIP_ONLY_BINARY = ":all:"

[feature.build.target.unix.tasks]
build = "colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"

# Dependencies used by all environments
[dependencies]
python = ">=3.12, <3.13"
# Build tools
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
# ROS specific tools
rosdep = "*"
colcon-common-extensions = "*"

[target.linux.dependencies]
libgl-devel = "*"

# Define all the different ROS environments
# Each environment corresponds to a different ROS distribution
# and can be activated using the `pixi run/shell -e <environment>` command.
[environments]
humble = { features = ["humble", "build"] }
jazzy = { features = ["jazzy", "build"] }

[pypi-dependencies]
anytraverse = { version = ">=2.0.0, <3", extras = ["hf"] }
omegaconf = ">=2.3.1, <3"
hydra-core = ">=1.3.7, <2"

# Torch and torchvision are platform-specific
# Desktop and OSX
[target.linux-64.pypi-dependencies]
torch = "*"
torchvision = "*"

[target.osx-arm64.pypi-dependencies]
torch = "*"
torchvision = "*"

# JetPack 6
[target.jetpack-6.pypi-dependencies]
torch = { version = "==2.8.0", index = "https://pypi.jetson-ai-lab.io/jp6/129" }
torchvision = { version = "==0.23.0", index = "https://pypi.jetson-ai-lab.io/jp6/129" }

# JetPack 7
[target.jetpack-7.pypi-dependencies]
torch = { index = "https://download.pytorch.org/whl/cu132" }
torchvision = { index = "https://download.pytorch.org/whl/cu132" }

### ROS Humble ####
[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-ros-base = "*"
ros-humble-compressed-image-transport = ">=2.5.5,<3"
ros-humble-cv-bridge = ">=3.2.1,<4"
ros-humble-rmw-zenoh-cpp = ">=0.1.8,<0.2"

### ROS Jazzy ####
[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-compressed-image-transport = ">=4.0.7,<5"
ros-jazzy-rmw-zenoh-cpp = ">=0.2.10,<0.3"
ros-jazzy-cv-bridge = ">=4.1.0,<5"
